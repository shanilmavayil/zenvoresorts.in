<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Resorts | Zenvo Resorts</title>
  <meta name="description" content="Browse Zenvo Resorts' handpicked stays in Kakkadampoyil.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,700&family=Outfit:wght@300&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/resorts.css">
</head>
<body>

  <div id="site-header"></div>

  <main class="resorts-page">
    <h1>Resorts</h1>

    <form class="filters" id="filters" aria-label="Filter resorts" onsubmit="return false">
      <label>Min price
        <input type="number" id="min-price" inputmode="numeric" min="0" step="50" placeholder="e.g. 700">
      </label>
      <label>Max price
        <input type="number" id="max-price" inputmode="numeric" min="0" step="50" placeholder="e.g. 1000">
      </label>
      <label>Guests
        <input type="number" id="guest-count" inputmode="numeric" min="1" step="1" placeholder="No. of guests">
      </label>
      <label>Sort by
        <select id="sort-by">
          <option value="default">Default</option>
          <option value="low">Price: low to high</option>
          <option value="high">Price: high to low</option>
        </select>
      </label>
      <button type="button" id="reset-filters" class="filter-reset">Reset</button>
    </form>
    <p class="result-count" id="result-count" aria-live="polite"></p>

    <div class="resort-grid" id="resort-grid"></div>
    <p class="no-results" id="no-results" hidden>No resorts match these filters. Try changing them.</p>
    <div class="load-more-wrap"><button type="button" id="load-more" class="load-more" hidden>Load more</button></div>
  </main>

  <div id="site-footer"></div>

  <script src="js/config.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/resorts-data.js"></script>
  <script src="js/resorts.js"></script>
</body>
</html>
